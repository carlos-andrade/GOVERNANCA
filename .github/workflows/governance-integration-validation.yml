name: Governance Integration — validação F1/F2

on:
  push:
    branches: [main]
    paths:
      - "schemas/governanca-config.schema.json"
      - "docs/01-governanca/ESPECIFICACAO-GOVERNANCE-INTEGRATION-FRAMEWORK-001.md"
      - "docs/01-governanca/DEC-GOV-INTEGRATION-FRAMEWORK-001.md"
      - "docs/01-governanca/IMPLEMENTACAO-F2-GOVERNANCE-ENGINE.md"
      - "automation/governance_engine.py"
      - "automation/__init__.py"
      - "tests/test_governance_config_schema.py"
      - "tests/test_governance_engine.py"
      - "automation/propagar_governanca.py"
      - "tests/test_propagate_governance.py"
      - ".github/workflows/propagar-regras-governanca.yml"
      - ".github/workflows/governance-integration-validation.yml"
      - ".github/workflows/governance-integration-reusable.yml"
  pull_request:
    paths:
      - "schemas/governanca-config.schema.json"
      - "docs/01-governanca/ESPECIFICACAO-GOVERNANCE-INTEGRATION-FRAMEWORK-001.md"
      - "docs/01-governanca/DEC-GOV-INTEGRATION-FRAMEWORK-001.md"
      - "docs/01-governanca/IMPLEMENTACAO-F2-GOVERNANCE-ENGINE.md"
      - "automation/governance_engine.py"
      - "automation/__init__.py"
      - "tests/test_governance_config_schema.py"
      - "tests/test_governance_engine.py"
      - "automation/propagar_governanca.py"
      - "tests/test_propagate_governance.py"
      - ".github/workflows/propagar-regras-governanca.yml"
      - ".github/workflows/governance-integration-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-integration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-f1-f2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML
      - name: Validar sintaxe JSON do esquema
        run: python -m json.tool schemas/governanca-config.schema.json > /dev/null
      - name: Executar testes F1/F2
        run: python -m unittest discover -s tests -p "test_governance_config_schema.py" -v && python -m unittest discover -s tests -p "test_governance_engine.py" -v && python -m unittest discover -s tests -p "test_propagate_governance.py" -v
      - name: Smoke test — relatório JSON
        run: |
          python automation/governance_engine.py --root . > /tmp/governance-report.json || test "$?" -eq 2
          python -m json.tool /tmp/governance-report.json > /dev/null
