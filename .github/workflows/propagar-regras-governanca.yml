name: Propagar regras canónicas da GOVERNANCA

on:
  push:
    branches: [main]
    paths:
      - "CONSTITUICAO.md"
      - "ROADMAP-PADRAO-GOVERNANCA.md"
      - "CARTA-CONTRATO-PADRAO-ROADMAP.md"
      - "standards/**"
      - "docs/**"
      - "templates/**"
      - "CABEÇALHO/**"
      - "WATCHDOG/**"
      - "registry/repositorios-consumidores.json"
      - "automation/propagar_governanca.py"
      - "tests/test_propagate_governance.py"
      - ".github/workflows/propagar-regras-governanca.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem criar/atualizar Pull Requests"
        required: true
        type: boolean
        default: true
      repository:
        description: "Repositório específico (opcional, owner/name)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: propagar-governanca-main
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar registo e sintaxe
        run: |
          python -m json.tool registry/repositorios-consumidores.json >/dev/null
          python -m py_compile automation/propagar_governanca.py tests/test_propagate_governance.py
          python -m unittest discover -s tests -p 'test_propagate_governance.py' -v
          python automation/propagar_governanca.py --help

  propagar:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar credencial de distribuição
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCA_SYNC_TOKEN }}
        run: |
          set +e
          if [ -z "$GH_TOKEN" ]; then
            printf '%s\n' '{"status":"FAIL","stage":"authentication","code":"TOKEN_MISSING","error":"Secret GOVERNANCA_SYNC_TOKEN não configurado."}' > governanca-propagacao.json
            echo "::error::O secret GOVERNANCA_SYNC_TOKEN está ausente. Configure-o em Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Validate the actual environment token with an authenticated API request.
          # This proves that the GH_TOKEN injected by Actions is accepted by GitHub.
          set +e
          identity="$(gh api user --jq .login 2>/dev/null)"
          auth_rc=$?
          set -e
          if [ "$auth_rc" -ne 0 ] || [ -z "$identity" ]; then
            printf '%s\\n' '{"status":"FAIL","stage":"authentication","code":"TOKEN_REJECTED","error":"O GitHub não aceitou GOVERNANCA_SYNC_TOKEN ou não conseguiu validar a identidade. Verifique validade, expiração, revogação e acesso do token."}' > governanca-propagacao.json
            echo "::error::O GitHub não aceitou GOVERNANCA_SYNC_TOKEN. Substitua o secret por um token ativo e execute novamente em dry-run."
            echo "::notice::Nunca coloque o token em logs ou mensagens."
            exit 1
          fi

          # Authentication to the source repo alone does not prove consumer write permissions.
          printf '{"status":"PASS","stage":"authentication","identity":"%s","note":"dry-run verifies authentication and read access only; write permissions require a controlled PR execution after the dry-run."}\\n' "$identity" > governanca-propagacao.json
          echo "Autenticação validada para a conta: $identity"

      - name: Distribuir por Pull Request
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCA_SYNC_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          TARGET_REPO: ${{ inputs.repository }}
        run: |
          set -o pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$TARGET_REPO" ]; then args+=(--repo "$TARGET_REPO"); fi
          python automation/propagar_governanca.py "${args[@]}" | tee governanca-propagacao.json

      - name: Guardar relatório de distribuição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-propagacao-governanca
          path: governanca-propagacao.json
          if-no-files-found: warn
          retention-days: 90
