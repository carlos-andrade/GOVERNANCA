name: Sincronizar barra de status

on:
  push:
    branches: [main]
    paths:
      - "registry/status-do-projeto.json"
      - "automation/sync_project_status.py"
      - ".github/workflows/sync-project-status.yml"
      - "tests/test_sync_project_status.py"
      - "automation/governance_engine.py"
      - "tests/test_governance_engine.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-project-status-main
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de validação dos testes
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML

      - name: Executar testes automatizados
        run: python -m unittest discover -s tests -v

      - name: Validar e sincronizar README e SVG
        run: python automation/sync_project_status.py

      - name: Validar sincronização final
        run: python automation/sync_project_status.py --check

      - name: Publicar atualização do painel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md assets/status-dashboard.svg; then
            echo "README e SVG já estão sincronizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/status-dashboard.svg
          git commit -m "chore(status): sincronizar painel visual"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
