name: Sincronizar barra de status

on:
  push:
    branches: [main]
    paths:
      - "registry/status-do-projeto.json"
      - "automation/sync_project_status.py"
      - ".github/workflows/sync-project-status.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-project-status-main
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar e sincronizar README
        run: python automation/sync_project_status.py

      - name: Validar sincronização final
        run: python automation/sync_project_status.py --check

      - name: Publicar atualização do README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(status): sincronizar barra de status"
          git push origin HEAD:main
