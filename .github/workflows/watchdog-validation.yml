name: WATCHDOG — validação e testes

on:
  push:
    branches: [main]
    paths:
      - "WATCHDOG/**"
      - ".github/workflows/watchdog-validation.yml"
  pull_request:
    paths:
      - "WATCHDOG/**"
      - ".github/workflows/watchdog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes unitários WATCHDOG
        run: python -m unittest discover -s WATCHDOG/tests -v
      - name: Validar registo e controlos locais
        run: python WATCHDOG/engine/watchdog.py --check
